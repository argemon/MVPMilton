name: Fundação MongoDB
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    env:
      TEST_MONGO_CONTAINER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: ./scripts/verify-architecture.ps1
        shell: pwsh
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test -c Release --no-build --logger trx --results-directory artifacts/tests
      - name: Auditoria de dependências
        run: dotnet package list --vulnerable --include-transitive --format json > artifacts/vulnerabilities.json
      - name: Bloquear vulnerabilidades
        shell: pwsh
        run: |
          $report = Get-Content artifacts/vulnerabilities.json -Raw | ConvertFrom-Json
          foreach ($project in $report.projects) { foreach ($framework in $project.frameworks) { if ($framework.topLevelPackages -or $framework.transitivePackages) { throw 'Dependência vulnerável detectada' } } }
      - name: Verificar segredos
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source /repo --no-git --redact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-fundacao
          path: artifacts/
